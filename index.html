<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>chanelle ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#060008;overflow:hidden;}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;}
#ui{position:fixed;bottom:28px;left:0;right:0;text-align:center;pointer-events:none;font-family:'Share Tech Mono',monospace;}
#label{font-size:clamp(18px,5vw,30px);color:#ff69a0;letter-spacing:5px;animation:glow 2.5s ease-in-out infinite;}
#sub{font-size:clamp(10px,2.5vw,14px);color:rgba(255,105,160,0.4);letter-spacing:2px;margin-top:7px;}
#hint{font-size:clamp(9px,2vw,12px);color:rgba(255,105,160,0.2);margin-top:10px;animation:blink 2s step-end infinite;}
@keyframes glow{0%,100%{text-shadow:0 0 16px #ff69a0,0 0 32px #ff1493;}50%{text-shadow:0 0 36px #ff69a0,0 0 80px #ff1493,0 0 120px #ff006655;}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="label">chanelle ♡</div>
  <div id="sub">a little something for you ♡</div>
  <div id="hint">[ tap ]</div>
</div>
<script>
// ── canvas setup ──────────────────────────────────────────────────────────
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');
let W,H,CX,CY;
function resize(){
  W=cv.width=window.innerWidth;
  H=cv.height=window.innerHeight;
  CX=W/2; CY=H/2;
}
resize();
window.addEventListener('resize',resize);

// ── helpers ───────────────────────────────────────────────────────────────
const rnd  = (a,b)=>a+Math.random()*(b-a);
const pick = a=>a[Math.floor(Math.random()*a.length)];
const clamp= (v,a,b)=>Math.max(a,Math.min(b,v));
const eio  = t=>t<.5?2*t*t:-1+(4-2*t)*t;

const PINKS   =['#ff69a0','#ff1493','#e0157a','#ffb3cc','#ff5ca8','#ffc0cb','#ff79b0','#ffaad4'];
const MAGENTAS=['#ff1493','#e0157a','#c01068'];
const GREENS  =['#4aaa4a','#3a9a3a','#5acc5a','#2a7a2a'];

// ── 3D projection ─────────────────────────────────────────────────────────
const FOV=420;
function proj(x,y,z,camZ){
  const s=FOV/(FOV+(z+camZ));
  return{x:CX+x*s, y:CY+y*s, s};
}

// ── build flower data ─────────────────────────────────────────────────────
const NUM=60;
const flowers=[];
for(let i=0;i<NUM;i++){
  const theta=rnd(0,Math.PI*2);
  const phi  =rnd(0,Math.PI*.72);
  const r    =rnd(30,150);
  const scale=Math.min(W,H)/480;
  flowers.push({
    ox: r*Math.sin(phi)*Math.cos(theta)*scale,
    oy:(r*Math.cos(phi)*.7+40)*scale,
    oz: r*Math.sin(phi)*Math.sin(theta)*.55*scale,
    color : pick(PINKS),
    color2: pick(MAGENTAS),
    size  : rnd(6,18)*scale,
    petals: Math.random()<.4?8:(Math.random()<.5?5:6),
    rot   : rnd(0,Math.PI*2),
    rotSpd: rnd(-.015,.015),
    delay : .3+(i/NUM)*2.1,
    alpha : 0,
    sc    : 0,
  });
}

// ── stems ─────────────────────────────────────────────────────────────────
const stems=[];
for(let i=0;i<8;i++){
  const angle=(i/8)*Math.PI*2;
  const scale=Math.min(W,H)/480;
  const r=rnd(10,50)*scale;
  stems.push({
    pts:[
      {x:Math.cos(angle)*r,     y: 50*scale, z:Math.sin(angle)*r},
      {x:Math.cos(angle)*r*.7,  y: 90*scale, z:Math.sin(angle)*r*.7},
      {x:Math.cos(angle)*r*.4,  y:140*scale, z:Math.sin(angle)*r*.4},
      {x:Math.cos(angle)*r*.15, y:190*scale, z:Math.sin(angle)*r*.15},
      {x:Math.cos(angle)*r*.05, y:230*scale, z:Math.sin(angle)*r*.05},
    ],
    color:pick(GREENS),
    progress:0,
  });
}

// ── leaves ────────────────────────────────────────────────────────────────
const leaves=[];
for(let i=0;i<10;i++){
  const scale=Math.min(W,H)/480;
  const angle=rnd(0,Math.PI*2);
  const h=rnd(60,160)*scale;
  const r=rnd(20,60)*scale;
  leaves.push({
    ox:Math.cos(angle)*r, oy:h, oz:Math.sin(angle)*r,
    rot:angle+rnd(-.3,.3),
    size:rnd(16,30)*scale,
    color:pick(GREENS),
    delay:.1+i*.08, alpha:0, sc:0,
  });
}

// ── particles ─────────────────────────────────────────────────────────────
const PART=200;
const parts=[];
for(let i=0;i<PART;i++){
  const scale=Math.min(W,H)/480;
  const angle=rnd(0,Math.PI*2);
  const r=rnd(0,180)*scale;
  parts.push({
    x:Math.cos(angle)*r, y:rnd(-200,200)*scale, z:Math.sin(angle)*r,
    vx:rnd(-.3,.3), vy:rnd(-.4,-1.4), vz:rnd(-.3,.3),
    color:pick(PINKS),
    char:pick(['♡','*','+','·','~','♡']),
    size:rnd(8,15),
    alpha:rnd(.3,.9),
  });
}

// ── burst ─────────────────────────────────────────────────────────────────
const burst=[];
function triggerBurst(){
  for(let i=0;i<50;i++){
    const angle=rnd(0,Math.PI*2);
    const phi=rnd(0,Math.PI);
    const spd=rnd(2,8);
    const scale=Math.min(W,H)/480;
    burst.push({
      x:0,y:0,z:0,
      vx:Math.sin(phi)*Math.cos(angle)*spd*scale,
      vy:Math.sin(phi)*Math.sin(angle)*spd*scale-.5,
      vz:Math.cos(phi)*spd*scale,
      life:1, decay:rnd(.012,.028),
      color:pick(PINKS),
      char:pick(['♡','*','~','+']),
      size:rnd(10,20),
    });
  }
}

// ── bubu canvas ───────────────────────────────────────────────────────────
const BC=document.createElement('canvas');
BC.width=BC.height=200;
const bc=BC.getContext('2d');
(function drawBubu(){
  bc.clearRect(0,0,200,200);
  // body
  bc.fillStyle='#f0eaff';
  bc.beginPath();bc.ellipse(100,138,55,46,0,0,Math.PI*2);bc.fill();
  // head
  bc.fillStyle='#ffffff';
  bc.beginPath();bc.arc(100,82,52,0,Math.PI*2);bc.fill();
  // ears
  bc.fillStyle='#ffffff';
  bc.beginPath();bc.arc(60,38,20,0,Math.PI*2);bc.fill();
  bc.beginPath();bc.arc(140,38,20,0,Math.PI*2);bc.fill();
  bc.fillStyle='#ffb3cc';
  bc.beginPath();bc.arc(60,38,11,0,Math.PI*2);bc.fill();
  bc.beginPath();bc.arc(140,38,11,0,Math.PI*2);bc.fill();
  // eyes
  bc.fillStyle='#1a1a1a';
  bc.beginPath();bc.arc(84,76,8,0,Math.PI*2);bc.fill();
  bc.beginPath();bc.arc(116,76,8,0,Math.PI*2);bc.fill();
  bc.fillStyle='#fff';
  bc.beginPath();bc.arc(87,73,3,0,Math.PI*2);bc.fill();
  bc.beginPath();bc.arc(119,73,3,0,Math.PI*2);bc.fill();
  // nose
  bc.fillStyle='#ff9abc';
  bc.beginPath();bc.ellipse(100,91,8,6,0,0,Math.PI*2);bc.fill();
  // mouth
  bc.strokeStyle='#cc6688';bc.lineWidth=2.5;
  bc.beginPath();bc.arc(100,91,11,.15,Math.PI-.15);bc.stroke();
  // cheeks
  bc.fillStyle='rgba(255,150,170,.35)';
  bc.beginPath();bc.ellipse(72,97,14,8,-.2,0,Math.PI*2);bc.fill();
  bc.beginPath();bc.ellipse(128,97,14,8,.2,0,Math.PI*2);bc.fill();
})();

// ── draw helpers ──────────────────────────────────────────────────────────
function drawPetal(sx,sy,size,angle,color,alpha){
  ctx.save();
  ctx.globalAlpha=clamp(alpha,0,1);
  ctx.translate(sx,sy);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo( size*.4, size*.1,  size*.5, size*.6,  0, size*.9);
  ctx.bezierCurveTo(-size*.5, size*.6, -size*.4, size*.1,  0, 0);
  ctx.fillStyle=color;
  ctx.shadowColor=color;ctx.shadowBlur=size*.4;
  ctx.fill();
  ctx.restore();
}

function drawFlower(sx,sy,scale,f){
  if(f.alpha<=0||f.sc<=0)return;
  const s=f.size*f.sc*scale;
  const a=clamp(f.alpha,0,1);
  for(let p=0;p<f.petals;p++){
    const pa=f.rot+(p/f.petals)*Math.PI*2;
    drawPetal(sx,sy,s,pa,f.color,a*.9);
  }
  for(let p=0;p<f.petals;p++){
    const pa=f.rot+(p/f.petals)*Math.PI*2+Math.PI/f.petals;
    drawPetal(sx,sy,s*.55,pa,f.color2,a*.7);
  }
  ctx.save();
  ctx.globalAlpha=a;
  ctx.beginPath();ctx.arc(sx,sy,s*.28,0,Math.PI*2);
  ctx.fillStyle='#ffd700';
  ctx.shadowColor='#ffd700';ctx.shadowBlur=s*.5;
  ctx.fill();ctx.restore();
}

function drawStem(stem,rotY,camZ){
  if(stem.progress<=0)return;
  const count=Math.max(2,Math.floor(stem.pts.length*stem.progress));
  const sub=stem.pts.slice(0,count);
  if(stem.progress<1&&count<stem.pts.length){
    const frac=(stem.progress*(stem.pts.length-1))%1;
    const a=stem.pts[count-1], b=stem.pts[count]||a;
    sub.push({x:a.x+(b.x-a.x)*frac, y:a.y+(b.y-a.y)*frac, z:a.z+(b.z-a.z)*frac});
  }
  ctx.save();
  ctx.beginPath();
  sub.forEach((p,i)=>{
    const rx=p.x*Math.cos(rotY)-p.z*Math.sin(rotY);
    const rz=p.x*Math.sin(rotY)+p.z*Math.cos(rotY);
    const pr=proj(rx,p.y,rz,camZ);
    i===0?ctx.moveTo(pr.x,pr.y):ctx.lineTo(pr.x,pr.y);
  });
  ctx.strokeStyle=stem.color;
  ctx.lineWidth=2;
  ctx.globalAlpha=.75;
  ctx.shadowColor=stem.color;ctx.shadowBlur=4;
  ctx.stroke();ctx.restore();
}

function drawLeaf(leaf,rotY,camZ){
  if(leaf.alpha<=0)return;
  const rx=leaf.ox*Math.cos(rotY)-leaf.oz*Math.sin(rotY);
  const rz=leaf.ox*Math.sin(rotY)+leaf.oz*Math.cos(rotY);
  const p=proj(rx,leaf.oy,rz,camZ);
  ctx.save();
  ctx.globalAlpha=clamp(leaf.alpha,0,1);
  ctx.translate(p.x,p.y);
  ctx.rotate(leaf.rot+rotY);
  ctx.scale(p.s*leaf.sc,p.s*leaf.sc);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo( leaf.size*.38, leaf.size*.12, leaf.size*.45, leaf.size*.6, 0, leaf.size);
  ctx.bezierCurveTo(-leaf.size*.45, leaf.size*.6, -leaf.size*.38, leaf.size*.12, 0, 0);
  ctx.fillStyle=leaf.color;
  ctx.shadowColor=leaf.color;ctx.shadowBlur=4;
  ctx.fill();ctx.restore();
}

function drawBubuSprite(bobY,bubuSc){
  if(bubuSc<=0)return;
  const scale=Math.min(W,H)/480;
  const bw=160*scale*bubuSc;
  const bh=160*scale*bubuSc;
  const bx=CX-bw/2;
  const by=CY+200*scale+bobY-bh/2;
  ctx.save();
  ctx.globalAlpha=clamp(bubuSc,0,1);
  ctx.shadowColor='#ff69a0';ctx.shadowBlur=20;
  ctx.drawImage(BC,bx,by,bw,bh);
  ctx.restore();
}

// ── animation state ───────────────────────────────────────────────────────
let startT=null, t=0;
let rotY=0;
let bubuSc=0, ribbonSc=0;
let partOpacity=0;
let camZ=200; // start far, zoom to 0

function getP(elapsed,s,e){return eio(clamp((elapsed-s)/(e-s),0,1));}

// ribbon state
let ribbonAlpha=0, ribbonY=0;

// ── main loop ─────────────────────────────────────────────────────────────
function loop(now){
  requestAnimationFrame(loop);
  if(!startT)startT=now;
  const elapsed=(now-startT)/1000;
  t+=.016;

  ctx.clearRect(0,0,W,H);

  // bg glow
  const bg=ctx.createRadialGradient(CX,CY,0,CX,CY,Math.max(W,H)*.7);
  bg.addColorStop(0,'rgba(35,0,25,.5)');
  bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // camera zoom
  camZ=Math.max(0,180*(1-eio(getP(elapsed,0,.9))));

  // rotation ramps in
  const spinRamp=eio(getP(elapsed,1,2.2));
  rotY+=.007*spinRamp;

  const scale=Math.min(W,H)/480;

  // stems
  stems.forEach((s,i)=>{
    const t0=.15+i*.06;
    s.progress=getP(elapsed,t0,t0+.65);
    drawStem(s,rotY,camZ);
  });

  // leaves
  leaves.forEach(l=>{
    const p=getP(elapsed,l.delay,l.delay+.3);
    l.sc=p<1?p*(1+.3*Math.sin(p*Math.PI)):1;
    l.alpha=p;
    drawLeaf(l,rotY,camZ);
  });

  // depth-sort flowers then draw
  const projected=flowers.map(f=>{
    const rx=f.ox*Math.cos(rotY)-f.oz*Math.sin(rotY);
    const rz=f.ox*Math.sin(rotY)+f.oz*Math.cos(rotY);
    const p=proj(rx,f.oy,rz,camZ);
    return{...p,f};
  }).sort((a,b)=>a.s-b.s);

  projected.forEach(({x,y,s,f})=>{
    const p=getP(elapsed,f.delay,f.delay+.35);
    f.sc=p<1?p*(1+.4*Math.sin(p*Math.PI)):1;
    f.alpha=p;
    f.rot+=f.rotSpd;
    drawFlower(x,y,s,f);
  });

  // ribbon
  ribbonAlpha=getP(elapsed,2.0,2.5);
  if(ribbonAlpha>0){
    const scale2=Math.min(W,H)/480;
    const ry=CY+170*scale2+Math.sin(t*.8)*3;
    ctx.save();
    ctx.globalAlpha=ribbonAlpha;
    ctx.font=`${Math.min(W*.04,16)}px 'Share Tech Mono',monospace`;
    ctx.textAlign='center';
    ctx.fillStyle='#ff69a0';
    ctx.shadowColor='#ff1493';ctx.shadowBlur=14;
    ctx.fillText('~ ( ( ( CHANELLE ♡ ) ) ) ~',CX,ry);
    ctx.font=`${Math.min(W*.028,11)}px 'Share Tech Mono',monospace`;
    ctx.fillStyle='#e0157a';ctx.shadowBlur=8;
    ctx.fillText('~'.repeat(26),CX,ry-18);
    ctx.fillText('~'.repeat(26),CX,ry+20);
    ctx.restore();
  }

  // bubu
  const bubuP=getP(elapsed,2.4,2.8);
  bubuSc=bubuP<1?bubuP*(1+.5*Math.sin(bubuP*Math.PI)):1;
  const bobY=Math.sin(t*1.8)*5*scale;
  drawBubuSprite(bobY,bubuSc);

  // heart above bubu
  if(bubuSc>0){
    const scale2=Math.min(W,H)/480;
    const hx=CX, hy=CY+150*scale2+bobY;
    ctx.save();
    ctx.globalAlpha=clamp(bubuSc,0,1)*(.6+.4*Math.sin(t*2.5));
    ctx.font=`${18*scale2}px serif`;
    ctx.textAlign='center';
    ctx.fillStyle='#ff69a0';
    ctx.shadowColor='#ff1493';ctx.shadowBlur=12;
    ctx.fillText('♡',hx,hy);
    ctx.restore();
  }

  // particles fade in
  partOpacity=eio(getP(elapsed,2.5,3.5))*.8;
  if(partOpacity>0){
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.z+=p.vz;
      const sc2=Math.min(W,H)/480;
      if(p.y < -220*sc2){
        p.y=200*sc2;
        p.x=rnd(-180,180)*sc2;
        p.z=rnd(-180,180)*sc2;
      }
      const pr=proj(p.x,p.y,p.z,camZ);
      ctx.save();
      ctx.globalAlpha=p.alpha*partOpacity;
      ctx.font=`${p.size}px 'Share Tech Mono',monospace`;
      ctx.textAlign='center';
      ctx.fillStyle=p.color;
      ctx.shadowColor=p.color;ctx.shadowBlur=6;
      ctx.fillText(p.char,pr.x,pr.y);
      ctx.restore();
    });
  }

  // burst particles
  for(let i=burst.length-1;i>=0;i--){
    const p=burst[i];
    p.x+=p.vx; p.y+=p.vy; p.z+=p.vz;
    p.vy+=.15; // gravity
    p.life-=p.decay;
    if(p.life<=0){burst.splice(i,1);continue;}
    const pr=proj(p.x,p.y,p.z,camZ);
    ctx.save();
    ctx.globalAlpha=p.life*.9;
    ctx.font=`${p.size}px 'Share Tech Mono',monospace`;
    ctx.textAlign='center';
    ctx.fillStyle=p.color;
    ctx.shadowColor=p.color;ctx.shadowBlur=8;
    ctx.fillText(p.char,pr.x,pr.y);
    ctx.restore();
  }
}

requestAnimationFrame(loop);

// ── input ─────────────────────────────────────────────────────────────────
cv.addEventListener('click',triggerBurst);
cv.addEventListener('touchstart',e=>{e.preventDefault();triggerBurst();},{passive:false});
</script>
</body>
</html>
