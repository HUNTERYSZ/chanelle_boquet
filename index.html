<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ASCII Bouquet</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0c0c; }
  #wrap { position: relative; width: 100%; height: 100vh; min-height: 480px; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  button {
    position: absolute; top: 10px; right: 10px;
    font: 12px "Geist Mono", monospace; color: #bcbcbc; background: #1c1c1c;
    border: 1px solid #3a3a3a; border-radius: 6px; padding: 6px 10px; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid #ff5faf; outline-offset: 2px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" role="img" aria-label="Animated ASCII art bouquet of flowers in a paper wrap, slowly spinning, with floating hearts and sparkles"></canvas>
  <button id="toggle" type="button" aria-pressed="false">pause</button>
</div>
<script>
const FPS = 24, SPIN_SPEED = 0.6, TILT = 0.30, CAM_DIST = 4.0, NUM_HEARTS = 18, PIVOT_Y = 0.2;
const MESSAGE = "♥ chanibabyko<3 ♥";

// xterm-256 palettes, dark → bright (the original values were redacted, so these are reconstructions)
const WHITE = [244, 248, 251, 254, 255, 231];
const PINK = [132, 168, 204, 211, 218, 225];
const RED = [52, 88, 124, 160, 196, 203];
const PURPLE = [54, 91, 98, 135, 141, 183];
const YELLOW = [136, 178, 220, 226, 228, 230];
const ORANGE = [130, 166, 202, 208, 214, 216];
const GOLD_CENTER = [94, 136, 178, 220];
const DARK_CENTER = [52, 58, 94, 130];
const GREENS = [22, 28, 34, 40, 70, 76, 113];
const PAPER = [94, 137, 180, 186, 223, 230];
const RIBBON = [89, 125, 161, 198, 205];
const HEART_COLORS = [196, 198, 204, 211, 213];
const MSG_COLORS = [196, 202, 208, 214, 220, 213, 205, 198];
const SHADE = ".,-~:;=!*#$@";
const PETAL_SHADE = ".:-=+*%#@";
const TULIP_COLORS = [RED, PINK];

const DISC_TYPES = [
  [WHITE, GOLD_CENTER, 13], [PINK, GOLD_CENTER, 8], [RED, DARK_CENTER, 6],
  [PURPLE, GOLD_CENTER, 7], [YELLOW, DARK_CENTER, 12], [ORANGE, DARK_CENTER, 9],
];

const _L = [-0.45, 0.6, 0.66];
const _n = Math.hypot(..._L);
const [LX, LY, LZ] = _L.map(v => v / _n);

const XTERM = (() => {
  const basic = ["#000","#800000","#008000","#808000","#000080","#800080","#008080","#c0c0c0",
                 "#808080","#f00","#0f0","#ff0","#00f","#f0f","#0ff","#fff"];
  const lv = [0, 95, 135, 175, 215, 255];
  const out = [];
  for (let n = 0; n < 256; n++) {
    if (n < 16) out.push(basic[n]);
    else if (n < 232) { const m = n - 16; out.push(`rgb(${lv[Math.floor(m/36)]},${lv[Math.floor(m/6)%6]},${lv[m%6]})`); }
    else { const g = 8 + 10 * (n - 232); out.push(`rgb(${g},${g},${g})`); }
  }
  return out;
})();

function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const norm = v => { const m = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/m, v[1]/m, v[2]/m]; };
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const add = (p, d, k) => [p[0]+d[0]*k, p[1]+d[1]*k, p[2]+d[2]*k];

function buildScene() {
  const r = mulberry32(21);
  const uni = (a, b) => a + (b - a) * r();
  const pts = [];
  const neck = [0, -0.12, 0];
  const C = [0, 0.12, 0], D = 0.64, N = 10;
  const golden = Math.PI * (3 - Math.sqrt(5));
  const heads = [];
  for (let i = 0; i < N; i++) {
    const el = (88 - 60 * Math.sqrt(i / (N - 1))) * Math.PI / 180;
    const az = i * golden;
    const d = [Math.cos(el)*Math.cos(az), Math.sin(el), Math.cos(el)*Math.sin(az)];
    heads.push([add(C, d, D * uni(0.92, 1.05)), norm(d)]);
  }

  const tulipSlots = [3, 8];
  const flowers = [];
  let discI = 0;
  heads.forEach(([pos, axis], idx) => {
    const base = add(pos, axis, -0.03);
    for (let j = 0; j < 70; j++) {
      const t = j / 69;
      pts.push([base[0]+(neck[0]-base[0])*t, base[1]+(neck[1]-base[1])*t, base[2]+(neck[2]-base[2])*t,
                axis[0], 0, axis[2], GREENS, -0.15, true, null]);
    }
    if (tulipSlots.includes(idx)) {
      const nT = tulipSlots.filter(k => k < idx).length;
      flowers.push([pos, "tulip", TULIP_COLORS[nT % TULIP_COLORS.length], null, 0, 0.11, uni(0, 6.28)]);
    } else {
      const [petals, center, nPet] = DISC_TYPES[discI++ % DISC_TYPES.length];
      flowers.push([pos, "disc", petals, center, nPet, uni(0.12, 0.14), uni(0, 6.28)]);
    }
  });

  for (let i = 0; i < 8; i++) {
    const a = (i + 0.4) / 8 * 2 * Math.PI, c = Math.cos(a), s = Math.sin(a);
    const base = [0.26*c, 0.30, 0.26*s], d = norm([c, 0.15, s]), side = [-s, 0, c];
    const n = norm(cross(side, d)), L = 0.30, W = 0.07;
    for (let ti = 0; ti < 32; ti++) {
      const t = ti / 31;
      for (let wi = -5; wi <= 5; wi++) {
        const w = wi / 5, curl = 0.025 * w * w;
        pts.push([
          base[0] + d[0]*L*t + side[0]*W*Math.sin(Math.PI*t)*w + n[0]*curl,
          base[1] + d[1]*L*t - 0.10*t*t + n[1]*curl,
          base[2] + d[2]*L*t + side[2]*W*Math.sin(Math.PI*t)*w + n[2]*curl,
          n[0], n[1], n[2], GREENS, wi === 0 ? -0.25 : 0, true, null]);
      }
    }
  }

  const y0 = -0.20, y1 = 0.30, r0 = 0.06, r1 = 0.36, k = (r1 - r0) / (y1 - y0), rings = 50;
  for (let i = 0; i < rings; i++) {
    const t = i / (rings - 1), rad = r0 + (r1 - r0) * t;
    const count = Math.max(8, Math.trunc(170 * rad));
    for (let j = 0; j < count; j++) {
      const ph = (j + r()) / count * 2 * Math.PI, c = Math.cos(ph), s = Math.sin(ph);
      let y = y0 + (y1 - y0) * t;
      if (t > 0.9) y += 0.03 * Math.sin(9 * ph);
      const fold = 0.3 * (Math.abs(Math.sin(5 * ph)) - 0.6);
      const nn = norm([c, -k, s]);
      pts.push([rad*c, y, rad*s, nn[0], nn[1], nn[2], PAPER, fold, false, null]);
    }
  }

  for (let i = 0; i < 7; i++) {
    const a = i / 7 * 2 * Math.PI, sx = 0.025 * Math.cos(a), sz = 0.025 * Math.sin(a);
    for (let j = 0; j < 40; j++) {
      const t = j / 39;
      pts.push([sx*(1+1.2*t), -0.20-0.30*t, sz*(1+1.2*t), Math.cos(a), 0, Math.sin(a), GREENS, -0.1, true, null]);
    }
  }

  const by = -0.12, br = r0 + k * (by - y0) + 0.01;
  for (let j = 0; j < 90; j++) {
    const ph = j / 90 * 2 * Math.PI;
    for (const dy of [-0.012, 0, 0.012])
      pts.push([br*Math.cos(ph), by+dy, br*Math.sin(ph), Math.cos(ph), 0, Math.sin(ph), RIBBON, 0, false, null]);
  }
  const knot = [0, by, br + 0.01];
  for (const side of [-1, 1]) {
    for (let j = 0; j < 70; j++) {
      const a = j / 70 * 2 * Math.PI;
      const lx = side * (0.07 + 0.07 * Math.cos(a));
      const ly = 0.04 * Math.sin(a) + 0.02 * (0.07 + 0.07 * Math.cos(a)) / 0.14;
      for (const fill of [1.0, 0.7])
        pts.push([knot[0]+lx*fill, knot[1]+ly*fill, knot[2]+0.01, side*0.3, 0.2, 0.93, RIBBON, 0.1, true, null]);
    }
    for (let j = 0; j < 30; j++) {
      const t = j / 29;
      pts.push([knot[0]+side*0.06*t, knot[1]-0.15*t, knot[2]+0.015, side*0.2, 0, 0.98, RIBBON,
                -0.05 + 0.05*Math.sin(t*9), true, null]);
    }
  }
  for (const dx of [-0.01, 0, 0.01]) pts.push([dx, by, knot[2]+0.02, 0, 0, 1, RIBBON, 0.2, true, "@"]);

  const babies = [];
  for (let i = 0; i < 90; i++) {
    const a = r() * 2 * Math.PI, el = uni(0.3, 1.4), rr = uni(0.40, 0.58);
    babies.push([rr*Math.cos(a)*Math.cos(el), C[1] + rr*Math.sin(el), rr*Math.sin(a)*Math.cos(el), uni(0, 6.28)]);
  }
  const sparkles = [];
  for (let i = 0; i < 30; i++) {
    const a = r() * 2 * Math.PI, rr = uni(0.75, 0.95);
    sparkles.push([rr*Math.cos(a), uni(-0.3, 1.0), rr*Math.sin(a), uni(0, 6.28), uni(1.5, 4.0)]);
  }
  return { pts, flowers, babies, sparkles };
}

const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function updateHearts(hearts, dt) {
  while (hearts.length < NUM_HEARTS)
    hearts.push([Math.random(), 1 + Math.random(), 0.03 + Math.random()*0.05, Math.random()*6.28, pick(HEART_COLORS)]);
  for (const h of hearts) {
    h[1] -= h[2] * dt;
    if (h[1] < 0) { h[0] = Math.random(); h[1] = 1; h[4] = pick(HEART_COLORS); }
  }
}

function render(scene, t, cols, rows, hearts) {
  const { pts, flowers, babies, sparkles } = scene;
  const size = cols * rows;
  const chars = new Array(size).fill(" ");
  const colors = new Uint8Array(size);
  const zbuf = new Float64Array(size).fill(-1e9);
  const viewRows = rows - 2;
  const scale = Math.max(1, Math.min((viewRows - 2) / 1.45, (cols - 2) / 2.7));
  const sxScale = scale * 2;
  const cx = cols / 2, cy = 1 + 0.78 * scale;
  const ang = t * SPIN_SPEED, ca = Math.cos(ang), sa = Math.sin(ang);
  const ct = Math.cos(TILT), st = Math.sin(TILT);
  const clampB = b => Math.min(0.999, Math.max(0, b));
  const idx = (arr, b) => arr[Math.trunc(b * arr.length)];

  function projectF(x, y, z) {
    const xr = x*ca - z*sa, zr = x*sa + z*ca, yp = y - PIVOT_Y;
    const yt = yp*ct - zr*st, zt = yp*st + zr*ct, f = CAM_DIST / (CAM_DIST - zt);
    return [cx + xr*f*sxScale, cy - yt*f*scale, zt, f];
  }
  function project(x, y, z) {
    const [px, py, zt] = projectF(x, y, z);
    return [Math.trunc(px), Math.trunc(py), zt];
  }
  function plot(col, row, z, ch, color) {
    if (row >= 0 && row < viewRows && col >= 0 && col < cols) {
      const i = row * cols + col;
      if (z > zbuf[i]) { zbuf[i] = z; chars[i] = ch; colors[i] = color; }
    }
  }

  for (const [x, y, , phase, color] of hearts) {
    const col = ((Math.trunc((x + 0.015*Math.sin(t*1.2 + phase)) * cols) % cols) + cols) % cols;
    plot(col, Math.trunc(y * viewRows), -50, "♥", color);
  }

  for (const [x, y, z, nx, ny, nz, pal, tone, twoSided, override] of pts) {
    const [col, row, zt] = project(x, y, z);
    const nxr = nx*ca - nz*sa, nzr = nx*sa + nz*ca;
    const nyt = ny*ct - nzr*st, nzt = ny*st + nzr*ct;
    let dot = nxr*LX + nyt*LY + nzt*LZ;
    if (twoSided && dot < 0) dot = -dot * 0.55;
    const b = clampB(0.25 + 0.75*Math.max(0, dot) + tone);
    plot(col, row, zt, override || idx(SHADE, b), idx(pal, b));
  }

  for (const [[x, y, z], kind, pal, cpal, nPet, R, seed] of flowers) {
    const [fx, fy, zt, f] = projectF(x, y, z);
    const rx = R*f*sxScale, ry = R*f*scale;
    const dim = -0.4 * (1 - Math.min(1, Math.max(0, (zt + 0.6) / 1.2)));
    const rot = seed + ang * 0.7;
    for (let row = Math.trunc(fy - ry) - 1; row < Math.trunc(fy + ry) + 2; row++) {
      const dy = (row + 0.5 - fy) / ry;
      for (let col = Math.trunc(fx - rx) - 1; col < Math.trunc(fx + rx) + 2; col++) {
        const dx = (col + 0.5 - fx) / rx;
        if (kind === "disc") {
          const s = Math.hypot(dx, dy);
          if (s > 1) continue;
          if (s < 0.3) {
            const b = clampB(0.55 - 0.35*dx - 0.35*dy + dim);
            plot(col, row, zt + 0.06, s < 0.17 ? "@" : "o", idx(cpal, b));
            continue;
          }
          const ph = Math.atan2(dy, dx);
          const reach = 0.32 + 0.68 * Math.abs(Math.cos(nPet * (ph + rot) / 2)) ** 0.7;
          if (s > reach) continue;
          const edge = s > reach - 0.14 ? -0.22 : 0;
          const b = clampB(0.62 - 0.22*dx - 0.28*dy + 0.12*s + edge + dim);
          plot(col, row, zt + 0.04*(1 - s), idx(PETAL_SHADE, b), idx(pal, b));
        } else {
          const v = (1 - dy) / 2;
          if (v < 0 || v > 1) continue;
          const hw = 0.62 * Math.sin(Math.PI * 0.5 * Math.min(1, v*1.5 + 0.05));
          if (hw <= 0 || Math.abs(dx) > hw) continue;
          const xn = dx / hw;
          if (v > 0.72 + 0.28 * Math.cos(1.5*Math.PI*xn) ** 2) continue;
          const seam = Math.abs(Math.abs(xn) - 0.33) < 0.12 && v > 0.3 ? -0.25 : 0;
          const b = clampB(0.55 - 0.3*xn + 0.1*v + seam + dim);
          plot(col, row, zt + 0.03, idx(PETAL_SHADE, b), idx(pal, b));
        }
      }
    }
  }

  for (const [x, y, z, phase] of babies) {
    const [col, row, zt] = project(x, y, z);
    const star = Math.sin(t*2 + phase) > 0.6;
    plot(col, row, zt + 0.02, star ? "*" : "·", star ? 231 : 255);
  }
  for (const [x, y, z, phase, speed] of sparkles) {
    const [col, row, zt] = project(x, y, z);
    const tw = Math.sin(t*speed + phase);
    if (tw > 0.85) plot(col, row, zt, "*", 231);
    else if (tw > 0.4) plot(col, row, zt, "+", 225);
    else if (tw > 0) plot(col, row, zt, "·", 218);
  }

  const writeLine = (row, text, colorFn) => {
    const startC = Math.max(0, Math.floor((cols - text.length) / 2));
    [...text].forEach((ch, i) => {
      if (startC + i < cols) { chars[row*cols + startC + i] = ch; colors[row*cols + startC + i] = colorFn(i); }
    });
  };
  const shift = Math.trunc(t * 6);
  writeLine(rows - 2, MESSAGE, i => MSG_COLORS[(i + shift) % MSG_COLORS.length]);
  writeLine(rows - 1, "@kiorgod labyu bebe!", () => 238);
  return { chars, colors };
}

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const wrap = document.getElementById("wrap");
const toggle = document.getElementById("toggle");
const scene = buildScene();
const hearts = [];
let cols = 80, rows = 30, cw = 8, lh = 16, fontSize = 12;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const { width, height } = wrap.getBoundingClientRect();
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fontSize = width < 420 ? 8 : width < 700 ? 10 : 12;
  ctx.font = `${fontSize}px "Geist Mono", ui-monospace, monospace`;
  cw = ctx.measureText("M").width;
  lh = cw * 2.05;
  cols = Math.max(20, Math.floor(width / cw) - 1);
  rows = Math.max(12, Math.floor(height / lh) - 1);
}
new ResizeObserver(resize).observe(wrap);
resize();

let paused = false, elapsed = 0, last = performance.now(), acc = 0;
toggle.addEventListener("click", () => {
  paused = !paused;
  toggle.textContent = paused ? "play" : "pause";
  toggle.setAttribute("aria-pressed", String(paused));
});

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!paused) {
    acc += dt;
    if (acc >= 1 / FPS) {
      elapsed += acc;
      updateHearts(hearts, acc);
      acc = 0;
      const { chars, colors } = render(scene, elapsed, cols, rows, hearts);
      const { width, height } = wrap.getBoundingClientRect();
      ctx.clearRect(0, 0, width, height);
      ctx.font = `${fontSize}px "Geist Mono", ui-monospace, monospace`;
      ctx.textBaseline = "top";
      const ox = (width - cols * cw) / 2, oy = (height - rows * lh) / 2;
      let lastColor = -1;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const i = r * cols + c, ch = chars[i];
          if (ch === " ") continue;
          if (colors[i] !== lastColor) { lastColor = colors[i]; ctx.fillStyle = XTERM[lastColor]; }
          ctx.fillText(ch, ox + c * cw, oy + r * lh);
        }
      }
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
