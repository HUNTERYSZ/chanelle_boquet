
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d1c">
  <title>A Bouquet for You ♡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="scene"></canvas>

  <div class="intro" id="intro">
    <div class="intro-flower">✿</div>
    <p class="eyebrow">A LITTLE SURPRISE</p>
    <h1>Something special<br>for you.</h1>
    <p class="subtitle">I made this just for you ♡</p>
    <button id="openButton">Open your bouquet ♡</button>
  </div>

  <main class="gift" id="gift">
    <div class="bouquet-title">A LITTLE GIFT FOR YOU</div>
    <div class="character-label">♡</div>
    <div class="message">
      <h2>Just for you.</h2>
      <p>Hope this makes you smile.</p>
    </div>
    <button id="replayButton">Watch again ↻</button>
  </main>

  <script src="bouquet.js"></script>
</body>
</html>
